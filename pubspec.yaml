name: flowly
description: "An app to track your TODO"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.2.3
  dotted_border: ^3.1.0
  equatable: ^2.0.7
  intl: ^0.20.2
  table_calendar: ^3.2.0
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Kanit
      fonts:
        - asset: fonts/Kanit/Kanit-Thin.ttf
          weight: 100
        - asset: fonts/Kanit/Kanit-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: fonts/Kanit/Kanit-ExtraLight.ttf
          weight: 200
        - asset: fonts/Kanit/Kanit-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/Kanit/Kanit-Light.ttf
          weight: 300
        - asset: fonts/Kanit/Kanit-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/Kanit/Kanit-Regular.ttf
          weight: 400
        - asset: fonts/Kanit/Kanit-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Kanit/Kanit-Medium.ttf
          weight: 500
        - asset: fonts/Kanit/Kanit-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Kanit/Kanit-SemiBold.ttf
          weight: 600
        - asset: fonts/Kanit/Kanit-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Kanit/Kanit-Bold.ttf
          weight: 700
        - asset: fonts/Kanit/Kanit-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Kanit/Kanit-ExtraBold.ttf
          weight: 800
        - asset: fonts/Kanit/Kanit-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: fonts/Kanit/Kanit-Black.ttf
          weight: 900
        - asset: fonts/Kanit/Kanit-BlackItalic.ttf
          weight: 900
          style: italic
